[mypy]
python_version = 3.11
files =
    src/texture_set.py,
    src/texture_renderer.py,
    src/texture_naming.py,
    src/render_settings.py,
    src/constant.py,
    src/action_state.py,
    src/texture_loading_service.py,
    src/image_process.py,
    src/preview_controller.py,
    src/batch_processing_service.py,
    src/dow1_converter.py,
    src/pattern_controller.py,
    src/pattern_exchange.py,
    src/color_pattern_handler.py,
    src/settings_handler.py,
    src/file_selection_service.py,
    src/user_data.py
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Typed module set. Domain models and the initial rendering core are checked;
# the Tkinter presentation layer is not strict yet.
[mypy-src.texture_set]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.texture_renderer]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

