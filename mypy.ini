[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Initial typed module set. Expand this list gradually as core interfaces
# become stable; the Tkinter presentation layer is not strict yet.
[mypy-src.texture_set]
disallow_untyped_defs = True

[mypy-src.texture_renderer]
disallow_untyped_defs = True

[mypy-src.texture_naming]
disallow_untyped_defs = True

[mypy-src.render_settings]
disallow_untyped_defs = True
