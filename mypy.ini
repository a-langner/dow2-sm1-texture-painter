[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Typed module set. Domain models and the initial rendering core are checked;
# the Tkinter presentation layer is not strict yet.
[mypy-src.texture_set]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.texture_renderer]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.texture_naming]
disallow_untyped_defs = True

[mypy-src.render_settings]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.constant]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.action_state]
disallow_untyped_defs = True
